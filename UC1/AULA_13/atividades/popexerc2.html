<script>

let lista = [
        "leao",
        "gorila",
        "hiena",
        "tubarao"
    ]
    let confirmar = confirm("DESEJA EXCLUIR O ÚLTIMO ÍTEM DA LISTA?")

    while (lista.length > 0) {

        if (confirmar) {

            lista.pop();
            let resultado = 'LISTA DE ANIMAIS:\n';
            let tamanho = lista.length;
            for (i = 0; i < tamanho; i++) {

                resultado += `${i + 1}.${lista[i]}\n`
            }
            alert(resultado)

        }
        if (lista.length > 0) {
            confirmar = confirm("DESEJA EXCLUIR O ÚLTIMO ÍTEM DA LISTA?")

        } else {
            alert("lista vazia")
            
        }
    }

</script>
