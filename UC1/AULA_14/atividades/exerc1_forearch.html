<script>

    let option = prompt("DIGITE NOVO NOME");
    let alunos = [];
    while (option !== null && option !== "") {
            let resultado = "Lista de alunos:\n"
            alunos.push(option);
            alunos.forEach(function (aluno, i) {
                resultado += `${i + 1}.${aluno}\n`
            })
            alert(resultado);
            option = prompt("DIGITE NOVO NOME");
            // let lista = "Lista de aluno:\n"
    }





</script>
