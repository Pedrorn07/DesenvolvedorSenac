<script>

    let numero1 = Number(prompt("*Digite um numero: "))
    let numero2 = Number(prompt("**Digite um numero: "))
    function SomarNumeros(x, y) {
        let soma = x + y
        alert(`A soma do numero: ${x} e do numero: ${y} é igual a ${soma}`)
    }
    while (!isFinite.numero1 && !isFinite.numero2 && !Number.isNaN(numero1) && !Number.isNaN(numero2)) {

        SomarNumeros(numero1, numero2)
        numero1 = Number(prompt("*Digite um numero: "))
        numero2 = Number(prompt("**Digite um numero: "))
    }
    alert("sem aplicação")
</script>
