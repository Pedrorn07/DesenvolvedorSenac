<script>

    let valorCompra = Number(prompt("Digite o valor da compra: "))
    let percentualDesconto = Number(prompt("Digite o percentual de desconto: "))
    function calcularDesconto(valorCompra, percentualDesconto) {
        while (!isFinite.valorCompra && !isFinite.percentualDesconto) {
            if (valorCompra > 0 && percentualDesconto > 0) {
                let valorDesconto = valorCompra * percentualDesconto / 100
                let valorFinal = valorCompra - valorDesconto
                let mensagem = `
                O valor do Desconto R$ ${valorDesconto.toFixed(2)}
                Valor Final R$ ${valorFinal.toFixed(2)}`;
                return mensagem
            }
            valorCompra = Number(prompt("Digite o valor da compra: "))
            percentualDesconto = Number(prompt("Digite o percentual de desconto: "))
        }
    }
    alert(calcularDesconto(valorCompra, percentualDesconto))

</script>
