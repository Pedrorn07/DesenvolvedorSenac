<script>

    function somar(v1, v2) {
        let soma = v1 + v2
        alert(`soma total de ${v1}+${v2} e igual a: ${soma}`)
    }
    // somar(720,550)

    function operacoes(v1, v2, operacao) {
        let resultado = "";
        if (operacao == "somar") {
            resultado = v1 + v2
        } else if (operacao == "subtrair") {
            resultado = v1 - v2;
        } else if (operacao == "multiplicar") {
            resultado = v1 * v2;
        } else {
            resultado = v1 / v2
        }
        alert(`a oprecação de ${operacao} de ${v1} de ${v2} resultou em ${resultado}`)
    }
    operacoes(720, 415, "multiplicar");

</script>
