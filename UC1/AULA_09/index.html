<script>
    let valor = prompt("Digite sua idade");
    let acumulado = 0

    while (valor!== null && valor !==  "") {

        let valornum = Number(valor);
        if (Number.isFinite(valornum)) {

            acumulado += valornum
            // acumulado = acumulado + valor
            alert("Seu saldo atual é de R$ "+acumulado)

        } else {

            alert("Não é um número")
        }
        valor = prompt("Digite sua idade")
    }
</script>
